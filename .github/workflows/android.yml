name: AI Project Sync & Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: ai-project-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-check:
    name: Check & Build Android Project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android project SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Check Gradle Wrapper and print build identity
        shell: bash
        run: |
          test -f ./gradlew || { echo "ERROR: gradlew not found."; exit 1; }
          chmod +x ./gradlew
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Branch     : $GITHUB_REF_NAME"
          echo "Commit     : $GITHUB_SHA"
          echo "Actor      : $GITHUB_ACTOR"
          echo "Event      : $GITHUB_EVENT_NAME"

      - name: Show recent changes
        shell: bash
        run: |
          git log -10 --pretty=format:"%h | %an | %ad | %s" --date=short
          git diff-tree --root --no-commit-id --name-status -r HEAD

      - name: Restore complete map assets
        run: python3 tools/restore_assets.py

      - name: Verify assets and course references
        run: python3 tools/validate_assets.py

      - name: Gradle information
        run: ./gradlew --version

      - name: Unit tests, Android lint and Debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.run_number }}
          path: app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
